<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 加速设置</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18231f;
      --muted: #65736d;
      --paper: #f4f7f5;
      --white: #fff;
      --line: #dce5df;
      --green: #176b4b;
      --green-dark: #10543a;
      --orange: #e79a44;
      --error: #a33a32;
    }

    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .popup { padding: 22px 22px 18px; }
    .masthead { display: flex; align-items: center; gap: 11px; }
    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px 11px 11px 3px;
      background: var(--ink);
      color: var(--white);
      font-size: 18px;
      font-weight: 700;
    }
    .brand { font-size: 15px; font-weight: 720; letter-spacing: -.025em; }
    .caption { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .route {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 24px;
      padding: 15px 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 5px 14px 14px 14px;
      background: var(--white);
    }
    .route::before {
      position: absolute;
      z-index: 0;
      top: 50%;
      right: 25px;
      left: 45px;
      height: 1px;
      background: var(--line);
      content: "";
    }
    .route-node, .route-target { position: relative; z-index: 1; background: var(--white); }
    .route-node { padding-right: 7px; }
    .route-node strong { display: block; font-size: 12px; font-weight: 650; }
    .route-node small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .route-target {
      display: grid;
      width: 28px;
      height: 28px;
      margin-left: auto;
      place-items: center;
      border: 1px solid #d7e5dc;
      border-radius: 50%;
      color: var(--green);
      font-size: 15px;
    }
    .section-heading { margin: 0 0 6px; font-size: 18px; font-weight: 720; letter-spacing: -.035em; }
    .description { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .field-label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 650; }
    .proxy-input.input {
      display: block;
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #bdcbc2;
      border-radius: 7px;
      outline: none;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .proxy-input.input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #176b4b20; }
    .proxy-input::placeholder { color: #96a29b; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .save-button.btn {
      width: 100%;
      min-height: 40px;
      margin-top: 14px;
      border: 0;
      border-radius: 7px;
      background: var(--green);
      color: var(--white);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .save-button.btn:hover { background: var(--green-dark); }
    .save-button.btn:active { transform: translateY(1px); }
    .save-button.btn:disabled { opacity: .6; cursor: wait; }
    .saved {
      margin-top: 19px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .saved-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .saved-label::before { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); content: ""; }
    .saved-url {
      display: block;
      margin-top: 7px;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .saved-url.empty { color: #87948c; font-family: inherit; }
    .message { min-height: 16px; margin: 10px 0 0; color: var(--green); font-size: 11px; }
    .message[data-kind="error"] { color: var(--error); }
    .message:empty { display: none; }
    :focus-visible { outline: 3px solid #176b4b55; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="popup">
    <header class="masthead">
      <div class="mark" aria-hidden="true">↗</div>
      <div>
        <div class="brand">GitHub 加速</div>
        <div class="caption">让下载经过你指定的代理</div>
      </div>
    </header>

    <div class="route" aria-label="GitHub 链接将经过自定义代理">
      <div class="route-node"><strong>github.com</strong><small>下载与 Raw 文件</small></div>
      <div class="route-target" aria-hidden="true">↗</div>
    </div>

    <section aria-labelledby="settings-title">
      <h1 class="section-heading" id="settings-title">代理地址</h1>
      <p class="description">设置固定代理后，GitHub 下载链接会使用这个地址。</p>
      <form id="proxy-form" novalidate>
        <label class="field-label" for="proxy-url">代理服务 URL</label>
        <input class="proxy-input input input-bordered" id="proxy-url" name="proxyUrl" type="url"
          placeholder="https://proxy.example.com" autocomplete="url" spellcheck="false">
        <p class="hint">支持 HTTP 或 HTTPS，可包含服务路径（如 /github）；地址不能带查询参数或片段。</p>
        <button class="save-button btn btn-primary" id="save-button" type="submit">保存地址</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="saved" aria-label="当前保存的代理地址">
      <div class="saved-label">当前已保存</div>
      <output class="saved-url empty" id="saved-url">尚未设置代理地址</output>
    </section>
  </main>
  <script src="../lib/browser-polyfill.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
